title = 'OnTheCast Devs'
theme = 'hudocs'
baseURL = 'https://onthecast.github.io'
contentDir = "src"
enableRobotsTXT = true
enableInlineShortcodes = true
enableGitInfo = false

[menus]
  [[menus.main]]
    name = "About this project"
    url = "/about"
    weight = 1
    [menus.main.params]
      icon = "circle-info"

  [[menus.main]]
    name = "GitHub"
    url = "https://github.com/OnTheCast"
    weight = 2
    [menus.main.params]
      icon = "github"

[params]
  description = "OnTheCast Devs Website"
  brand_icon = "book-open"
# brand_logo = "logo.svg"
  docs_pagination = false

[module]
  [[module.imports]]
    path = "github.com/KKKZOZ/hugo-admonitions"